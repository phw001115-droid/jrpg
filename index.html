<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>취준 RPG</title>
<style>
@font-face{font-family:'Galmuri11';src:url(Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Galmuri11';src:url(Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Galmuri14';src:url(Galmuri14.woff2) format('woff2');font-weight:400;font-display:swap}
:root{
  --bg:#141a2c;--panel:#1d2540;--panel2:#273152;--panel3:#303c62;--edge:#080b16;--hi:#3b4874;
  --text:#eef1f8;--sub:#a3aecb;--dim:#6f7a99;
  --gold:#ffcf4d;--gold2:#ffe9a3;--red:#ff6f6f;--green:#6fe3a1;--blue:#6fb8ff;--purple:#b58cff;
  --rn:#c3cad8;--rr:#6fb8ff;--re:#b58cff;--rl:#ffcf4d;
  --f:'Galmuri11',system-ui,sans-serif;--big:'Galmuri14','Galmuri11',system-ui,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--f);font-size:15px;line-height:1.55;color:var(--text);min-height:100vh;
  background:var(--bg) radial-gradient(circle at 50% -10%,#24305a 0,transparent 55%) no-repeat fixed;-webkit-font-smoothing:none}
#app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px 118px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.tile{display:inline-block;flex:none;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:13px}
.dim{color:var(--dim);font-size:12.5px}
.gold{color:var(--gold)}
b,strong{font-weight:700}
/* 상단 */
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.logo{font-family:var(--big);font-size:22px;color:var(--gold);text-shadow:2px 2px 0 #7a4f00,0 0 0 #000;letter-spacing:.02em}
.purse{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;background:var(--panel);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);border-radius:3px;font-weight:700;color:var(--gold2)}
.save{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.save i{width:8px;height:8px;background:#5c6788;box-shadow:0 0 0 1px var(--edge)}
.save.on i{background:var(--green)}
.helpbtn{width:32px;height:32px;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);color:var(--gold);font-weight:700;border-radius:3px;cursor:pointer}
/* 페이지 머리 */
.pagehead{margin:4px 2px 10px}
.pagehead h1{margin:0;font-family:var(--big);font-weight:400;font-size:21px;color:var(--text)}
.pagehead p{margin:4px 0 0;color:var(--sub);font-size:13.5px}
/* 창(패널) */
.win{position:relative;background:var(--panel);border-radius:4px;padding:14px;margin:14px 2px;
  box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi),0 6px 0 0 rgba(0,0,0,.28)}
.win>h2{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:16px;font-weight:700;color:var(--gold)}
.win>h2 .meta{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--sub)}
.win>.desc{margin:0 0 12px;color:var(--sub);font-size:13px}
.inset{background:var(--panel2);border-radius:3px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--edge)}
.sep{height:2px;background:var(--edge);margin:12px 0;box-shadow:0 2px 0 var(--hi)}
/* 버튼 */
.btn{border:0;cursor:pointer;min-height:40px;padding:8px 14px;border-radius:2px;font-weight:700;font-size:14px;white-space:nowrap;
  background:var(--gold);color:#2a1d00;box-shadow:0 0 0 2px var(--edge),inset -3px -3px 0 rgba(0,0,0,.22),inset 3px 3px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--edge),inset 3px 3px 0 rgba(0,0,0,.22)}
.btn.blue{background:var(--blue);color:#05213d}
.btn.green{background:var(--green);color:#063a1f}
.btn.red{background:var(--red);color:#3d0606}
.btn.ghost{background:var(--panel3);color:var(--text)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.del{background:none;border:0;color:var(--red);cursor:pointer;padding:4px 8px;font-size:14px}
/* 입력 */
label.f{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:#10162a;border:0;border-radius:2px;padding:9px 10px;min-width:0;box-shadow:inset 0 0 0 2px var(--edge),inset 2px 2px 0 2px #0b1020}
input::placeholder,textarea::placeholder{color:#5f6a8a}
select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
textarea{width:100%;min-height:80px}
.field{display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
/* 히어로 장면 */
.scene{position:relative;height:300px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);
  background:linear-gradient(180deg,#5b8fe0 0,#5b8fe0 18%,#79a8ee 18%,#79a8ee 36%,#9cc3f5 36%,#9cc3f5 52%,#c4dcf9 52%,#c4dcf9 64%)}
.scene .cloud{position:absolute;height:12px;background:#fff;box-shadow:12px -8px 0 #fff,24px 0 0 #fff,-10px 4px 0 #eaf2ff;opacity:.9}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:36%;background-repeat:repeat;image-rendering:pixelated}
.scene .tree{position:absolute;bottom:26%;image-rendering:pixelated}
.scene .who{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:3}
.scene .glow{position:absolute;left:50%;bottom:4%;width:240px;height:240px;transform:translateX(-50%);z-index:1;pointer-events:none;border-radius:50%;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{50%{opacity:.65;transform:translateX(-50%) scale(1.06)}}
.scene .lv{position:absolute;left:10px;top:10px;z-index:5;background:rgba(10,14,28,.82);box-shadow:0 0 0 2px var(--edge);padding:6px 10px;border-radius:2px}
.scene .lv b{display:block;font-family:var(--big);font-weight:400;font-size:24px;color:var(--gold);line-height:1}
.scene .lv span{font-size:12px;color:var(--gold2)}
.scene .job{position:absolute;right:10px;top:10px;z-index:5;background:rgba(10,14,28,.82);box-shadow:0 0 0 2px var(--edge);padding:6px 10px;border-radius:2px;text-align:right;font-size:12px;max-width:48%}
.scene .job b{display:block;font-size:13.5px;color:var(--text)}
.scene .name{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;background:rgba(10,14,28,.85);padding:3px 12px;border-radius:2px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 0 0 2px var(--edge)}
.ribbon{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:5;white-space:nowrap}
.rb{display:inline-block;padding:4px 14px;font-size:13px;font-weight:700;color:#fff;border-radius:2px;box-shadow:0 0 0 2px var(--edge),inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.3);text-shadow:1px 1px 0 rgba(0,0,0,.45)}
.rb.n{background:#6c7896}.rb.r{background:#3c86d6}.rb.e{background:#8a5ad6}.rb.l{background:#e0a020;color:#2a1600;text-shadow:none;animation:shine 2s steps(2) infinite}
@keyframes shine{50%{background:#ffcf4d}}
/* 경험치 바 */
.bar{position:relative;height:18px;background:#0d1224;border-radius:2px;box-shadow:inset 0 0 0 2px var(--edge);overflow:hidden}
.bar>i{position:absolute;left:2px;top:2px;bottom:2px;background:repeating-linear-gradient(90deg,var(--c,var(--gold)) 0 6px,var(--c2,#ffb800) 6px 8px);max-width:calc(100% - 4px)}
.bar>span{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;font-weight:700;text-shadow:1px 1px 0 #000}
.bar.sm{height:10px}.bar.sm>i{background:var(--c,var(--gold))}
.bar.hp>i{--c:#ff6f6f;--c2:#d94444}.bar.mp>i{--c:#6fb8ff;--c2:#3f8de0}.bar.boss>i{--c:#ff5a4a;--c2:#c42a1e}
/* 목록 행 */
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--edge)}
.line:last-child{border-bottom:0}
.line .t{font-weight:700}
.line .s{font-size:12.5px;color:var(--sub)}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--panel3);color:var(--text);white-space:nowrap}
.badge.g{background:#1f6b45;color:#c9ffe0}.badge.r{background:#7a1f1f;color:#ffd6d6}.badge.y{background:#7a5a00;color:#ffefb3}
.ico{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:2px;box-shadow:0 0 0 2px var(--edge),inset -2px -2px 0 rgba(0,0,0,.25)}
/* 오늘 할 일 */
.todo{display:grid;gap:8px}
.todo .inset{display:flex;align-items:center;gap:10px}
.todo .k{font-size:12.5px;color:var(--sub)}
.todo .v{font-weight:700;font-size:16px}
/* 능력치 */
.stat{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid var(--edge)}
.stat:last-child{border-bottom:0}
.stat .lv{font-family:var(--big);font-size:17px;color:var(--gold)}
/* 훈장 */
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.medal{text-align:center;font-size:12px;line-height:1.35;padding:8px 4px;background:var(--panel2);border-radius:2px;box-shadow:inset 0 0 0 2px var(--edge)}
.medal.off{opacity:.35}
.medal .tile{display:block;margin:0 auto 4px}
/* 퀘스트 */
.q{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:2px solid var(--edge);cursor:pointer;user-select:none}
.q:last-of-type{border-bottom:0}
.q .ck{width:24px;height:24px;flex:none;background:#0d1224;box-shadow:inset 0 0 0 2px var(--hi);display:flex;align-items:center;justify-content:center;font-weight:700;color:#2a1d00}
.q.done .ck{background:var(--green);box-shadow:inset 0 0 0 2px #1f6b45}
.q.done .qt{color:var(--dim);text-decoration:line-through}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chestb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);border-radius:2px;cursor:pointer}
.chestb b{font-family:var(--big);font-size:18px}
.chestb[disabled]{opacity:.35;pointer-events:none}
/* 타이머 */
.dungeon{position:relative;height:300px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);background-repeat:repeat;image-rendering:pixelated}
.dungeon:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 0,rgba(5,7,16,.15) 45%,rgba(5,7,16,.75) 100%)}
.dungeon .wall{position:absolute;left:0;right:0;top:0;height:64px;background-repeat:repeat-x;image-rendering:pixelated}
.dungeon .who{position:absolute;left:50%;top:34px;transform:translateX(-50%);z-index:2}
.dungeon .clockbox{position:absolute;left:0;right:0;bottom:12px;z-index:3;text-align:center}
.clock{font-family:var(--big);font-size:46px;line-height:1.1;color:#fff;text-shadow:3px 3px 0 #000}
.subjs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.subjs button{display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;border-radius:2px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer;text-align:left;font-size:14px}
.subjs button.on{background:#3a3218;box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold2);font-weight:700}
details.more>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--gold)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:before{content:"▶ ";font-size:11px}
details.more[open]>summary:before{content:"▼ "}
/* 보스 */
.boss{position:relative;margin:14px 2px;background:var(--panel);border-radius:4px;padding:14px;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi),0 6px 0 0 rgba(0,0,0,.28)}
.boss.rage{box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px #c42a1e,0 6px 0 0 rgba(0,0,0,.28)}
.arena{position:relative;height:150px;margin:-2px -2px 12px;border-radius:2px;overflow:hidden;background-repeat:repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 2px var(--edge)}
.arena:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,transparent 0,rgba(5,7,16,.25) 50%,rgba(5,7,16,.8) 100%)}
.arena .mon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;animation:hover 2s steps(4) infinite}
.boss.rage .arena .mon{animation:shake .4s steps(2) infinite}
@keyframes hover{50%{transform:translate(-50%,-56%)}}
@keyframes shake{50%{transform:translate(-47%,-50%)}}
.arena .gr{position:absolute;right:8px;top:8px;z-index:3;font-family:var(--big);font-size:20px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:2px;box-shadow:0 0 0 2px var(--edge)}
.gr.S{background:#c42a1e;color:#fff}.gr.A{background:#e0a020;color:#2a1600}.gr.B{background:#3c86d6;color:#fff}
.arena .dd{position:absolute;left:8px;top:8px;z-index:3;font-family:var(--big);font-size:18px;background:rgba(10,14,28,.85);padding:2px 9px;border-radius:2px;box-shadow:0 0 0 2px var(--edge)}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:2px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);font-size:13px;cursor:pointer;border:0}
.chip input{margin:0;accent-color:var(--gold)}
/* 코디 */
.tabsx{display:flex;gap:6px;overflow-x:auto;margin:12px 2px 0;padding:2px 2px 4px;scrollbar-width:none}
.tabsx button{flex:none;border:0;border-radius:2px;padding:8px 12px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer;font-size:13.5px}
.tabsx button.on{background:var(--gold);color:#2a1d00;font-weight:700}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:2px;background:#10162a;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 2px var(--rc,var(--rn))}
.it.n{--rc:#5d6884}.it.r{--rc:var(--rr)}.it.e{--rc:var(--re)}.it.l{--rc:var(--rl);background:#2a2410}
.it.lock .spr,.it.lock .tile{opacity:.25;filter:grayscale(1)}
.it .lk{position:absolute;right:4px;bottom:3px;font-size:11px;color:var(--sub)}
.it.eq{box-shadow:inset 0 0 0 3px var(--gold),0 0 0 2px var(--edge)}
.it.eq:after{content:"착용";position:absolute;left:3px;top:3px;font-size:10.5px;font-weight:700;background:var(--gold);color:#2a1d00;padding:0 4px;border-radius:1px}
.it.sel{outline:2px solid #fff;outline-offset:-5px}
.it .pr{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:700;color:var(--gold2);text-shadow:1px 1px 0 #000}
.detail{margin-top:12px;padding:12px;border-radius:2px;background:#0e1326;box-shadow:inset 0 0 0 2px var(--hi)}
.detail .nm{font-weight:700;font-size:16px}
.nm.n{color:var(--rn)}.nm.r{color:var(--rr)}.nm.e{color:var(--re)}.nm.l{color:var(--rl)}
.swatch{width:36px;height:36px;border:0;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--edge)}
.swatch.on{box-shadow:inset 0 0 0 2px var(--edge),0 0 0 3px var(--gold)}
.pill{border:0;border-radius:2px;padding:7px 11px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer;font-size:13px}
.pill.on{background:var(--gold);color:#2a1d00;font-weight:700}
/* 스프라이트 */
.spr{position:relative;margin:0 auto;--s:3}
.spr i{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.spr.walk i{animation:walkf .9s steps(8) infinite}
@keyframes walkf{from{background-position-x:calc(var(--ox,0px) + var(--s) * -64px)}to{background-position-x:calc(var(--ox,0px) + var(--s) * -576px)}}
.it .spr{position:absolute;left:50%;top:50%}
/* 이펙트 입자 */
.fx{position:absolute;inset:-20px;pointer-events:none;z-index:4}
.fx i{position:absolute;display:block}
.p-spark{width:8px;height:8px;background:var(--c,#ffcf4d);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.4s steps(6) infinite}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.p-petal{width:8px;height:6px;background:#ffb3cf;box-shadow:inset -2px -2px 0 #e07aa4;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px);opacity:0}12%{opacity:1}100%{transform:translate(36px,260px);opacity:0}}
.p-ember{width:6px;height:6px;background:#ffd36b;box-shadow:0 0 0 2px #ff7a2a;animation:rise steps(10) infinite}
@keyframes rise{0%{transform:translateY(10px);opacity:0}15%{opacity:1}100%{transform:translateY(-180px);opacity:0}}
.p-coin{width:12px;height:12px;background:#ffcf4d;box-shadow:inset -2px -2px 0 #c48a00,0 0 0 2px #6b4a00;border-radius:50%}
.p-dot{width:5px;height:5px;background:#e9dcff;box-shadow:0 0 6px #b58cff}
.orb{position:absolute;left:50%;top:55%;width:0;height:0;animation:spin linear infinite}
.orb>i{transform:translate(var(--r),0)}
@keyframes spin{to{transform:rotate(360deg)}}
.p-bolt{width:14px;height:26px;animation:flick 1.6s steps(1) infinite}
@keyframes flick{0%,100%{opacity:0}8%,16%{opacity:1}22%{opacity:0}}
.p-conf{width:6px;height:8px;animation:fall linear infinite}
/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#0d1224;box-shadow:0 -2px 0 var(--edge),0 -4px 0 var(--hi);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:80px;border:0;background:none;color:var(--dim);font-size:11.5px;padding:3px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:2px}
.tabs button.on{color:var(--gold);background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge)}
.tabs button.on .tile{filter:none}
.tabs .tile{filter:grayscale(.6) brightness(.8)}
.xpline{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:21;height:6px;background:#0d1224;box-shadow:0 -2px 0 var(--edge)}
.xpline i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#ffb800 6px 8px)}
/* 알림 */
.feed{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.feed div{background:rgba(8,11,22,.94);box-shadow:0 0 0 2px var(--hi);color:var(--text);font-size:13px;padding:5px 10px;border-radius:2px;animation:feed 3.4s forwards;max-width:100%}
.feed div b{color:var(--gold)}
.feed div.b{box-shadow:0 0 0 2px var(--blue)}
@keyframes feed{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
/* 오버레이 */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,14,.86);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal,.win.modal{width:min(100%,400px);margin:0}
.cel{width:min(100%,380px);text-align:center;background:var(--panel);border-radius:4px;padding:22px 18px 16px;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--gold),0 0 0 6px rgba(255,207,77,.15);animation:pop .35s steps(5)}
@keyframes pop{0%{transform:scale(.6);opacity:0}}
.cel .vis{display:flex;justify-content:center;margin-bottom:8px;min-height:40px}
.cel .big{font-family:var(--big);font-size:34px;line-height:1.15;color:var(--gold);text-shadow:3px 3px 0 #6b4a00}
.cel .big.blue{color:var(--blue);text-shadow:3px 3px 0 #0b3a6e}.cel .big.pur{color:var(--purple);text-shadow:3px 3px 0 #3e1f7a}
.cel .l1{margin-top:8px;font-weight:700;font-size:16px}
.cel .l2{margin-top:6px;color:var(--sub);font-size:14px}
.cel .x{margin-top:16px}
.shake{animation:wob .3s steps(2) infinite}
@keyframes wob{50%{transform:rotate(-8deg)}}
.conf{position:fixed;top:-12px;width:6px;height:8px;z-index:60;animation:confd 2.6s steps(26) forwards;pointer-events:none}
@keyframes confd{to{transform:translateY(110vh) rotate(540deg)}}
/* 도움말 */
.help h3{margin:16px 0 6px;font-size:15px;color:var(--gold)}
.help p{margin:0 0 8px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:2px solid var(--edge);text-align:left;vertical-align:top}
table.t th{font-size:12.5px;color:var(--sub);font-weight:400}
.cred{font-size:12px;color:var(--sub);padding:6px 0;border-bottom:2px solid var(--edge)}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}

.sch{padding:8px 10px;margin:0 0 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);border-radius:3px}
.sch.past{opacity:.5}.schd{margin-top:4px;font-size:13.5px}
.sch .btn.sm{min-height:32px;padding:4px 10px}
.tabsx.wrapx{flex-wrap:wrap;overflow:visible}
.chart{display:block;width:100%;height:auto;margin-top:10px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);border-radius:3px}
.dot{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px var(--edge);flex:none}
.it.lock{background:var(--panel2)}
.it.lock .spr,.it.lock .tile,.it.lock svg{opacity:.85;filter:brightness(0)}
.it.lock .lk{left:0;right:0;text-align:center;color:#9aa6c8;font-weight:700}
.collect{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-weight:700;color:var(--gold2)}.collect .bar{flex:1}
.items.shop4{grid-template-columns:repeat(4,1fr)}
.pet{position:absolute;left:14px;bottom:10px;display:flex;flex-direction:column;align-items:center;z-index:3}
.pet span{font-size:11px;font-weight:700;color:#fff;background:#0009;padding:1px 6px;border-radius:2px;margin-top:-4px;white-space:nowrap}
.petbox{display:flex;align-items:center;justify-content:center;height:100%}
.grade{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;margin:0 auto;font-family:var(--big);font-size:56px;background:var(--panel2);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--hi);border-radius:4px}
.grade.sm{width:34px;height:34px;font-size:22px;margin:0}
.gS{color:var(--gold)}.gA{color:var(--blue)}.gB{color:var(--green)}.gC{color:#d6def0}.gD{color:#9aa6c8}
.ivq .t{font-size:13.5px}.ivst{border:0;cursor:pointer;min-width:52px;font-family:inherit}
.grid2>.field{min-width:0}.grid2 .field input,.grid2 .field select{min-width:0;width:100%;box-sizing:border-box}

function scoreChart(){
  var W=320,H=150,L=30,R=18,T0=10,B=22,keys=scTab==='all'?SC.map(function(s){return s[0]}):[scTab];
  var rows=S.scores.filter(function(r){return keys.indexOf(r.s)>=0}).slice().sort(function(a,b){return a.d.localeCompare(b.d)||a.t-b.t});
  if(!rows.length)return '<div class="sub" style="padding:18px 0;text-align:center">점수를 기록하면 여기에 그래프가 그려져요.</div>';
  var dates=[];rows.forEach(function(r){if(dates.indexOf(r.d)<0)dates.push(r.d)});dates=dates.slice(-12);
  var X=function(i){return dates.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(dates.length-1)},Y=function(p){return T0+(1-p)*(H-T0-B)};
  var g='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="모의고사 점수 추이">';
  [0,.5,1].forEach(function(p){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="#3b4874" stroke-width="1"'+(p===.5?' stroke-dasharray="3 3"':'')+'/><text x="'+(L-5)+'" y="'+(Y(p)+4)+'" text-anchor="end" fill="#9aa6c8" font-size="10">'+(p*100)+'</text>'});
  dates.forEach(function(d,i){if(dates.length<=6||i%2===0||i===dates.length-1)g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" fill="#9aa6c8" font-size="10">'+md(d)+'</text>'});
  keys.forEach(function(k){var pts=[];dates.forEach(function(d,i){var rs=rows.filter(function(r){return r.s===k&&r.d===d});if(rs.length){var r=rs[rs.length-1];pts.push([X(i),Y(r.v/r.m)])}});if(!pts.length)return;var c=SCK[k][3];
    if(pts.length>1)g+='<polyline fill="none" stroke="'+c+'" stroke-width="2.5" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
    pts.forEach(function(p){g+='<rect x="'+(p[0]-3.5)+'" y="'+(p[1]-3.5)+'" width="7" height="7" fill="'+c+'" stroke="#080b16" stroke-width="1.5"/>'})});
  return g+'</svg>';
}
